<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trade history | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc,f={from:'2026-10-01',to:'2026-10-23',side:'All trades',q:''},pg=1,size=25,cache={};
var VENUES={XETRA:['XETRA','Tradegate','XETRA'],Euronext:['Euronext Amsterdam','Cboe Europe','Euronext Amsterdam'],'SGX Catalist':['SGX Catalist']};
var MON='Oct 2026';
/* Sample data: every Deltablock trade of the month (the count and value match the company's figures), newest first.
   Times are in the company's own time zone: UTC for the European companies, Singapore time for the SGX company. */
function target(co){var m=String(co.value30||'').match(/([\d.]+)\s*M/);return m?parseFloat(m[1])*1e6:co.trades30*2000;}
function build(co){
 if(cache[co.id])return cache[co.id];
 var r=App.rng(App.seedOf(co.id)+99),N=co.trades30,days=[],i,d;
 for(d=1;d<=23;d++){var wd=new Date(Date.UTC(2026,9,d)).getUTCDay();if(wd!==0&&wd!==6)days.push(d);}
 var w=days.map(function(){return 0.6+r()*0.8;}),sum=w.reduce(function(a,b){return a+b;},0),cnt=w.map(function(x){return Math.floor(N*x/sum);}),acc=cnt.reduce(function(a,b){return a+b;},0),k=0;
 while(acc<N){cnt[k%cnt.length]++;acc++;k++;}
 var win=App.cur(co).tz==='SGT'?[540,1020]:[420,930],lm=String(co.last||'').match(/(\d\d):(\d\d)/),feedMin=lm?(+lm[1])*60+(+lm[2]):win[1],v=VENUES[co.exch]||[co.exch],tick=co.tick||0,out=[];
 days.forEach(function(day,di){
  var hi=di===days.length-1?Math.min(win[1],feedMin):win[1],ts=[];
  for(i=0;i<cnt[di];i++)ts.push(Math.round(win[0]+r()*(hi-win[0])));
  ts.sort(function(a,b){return a-b;});
  ts.forEach(function(min){
   var sh=Math.round((500+r()*r()*24000)/100)*100,pr=co.price*(0.985+r()*0.03);if(tick)pr=Math.round(pr/tick)*tick;
   out.push({iso:'2026-10-'+String(day).padStart(2,'0'),dt:day+' '+MON+' · '+String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'),side:r()<0.52?'Buy':'Sell',sh:sh,pr:pr,venue:v[Math.floor(r()*v.length)]});
  });
 });
 var raw=0;out.forEach(function(t){raw+=t.sh*t.pr;});var kf=target(co)/raw,no=88241;
 for(i=out.length-1;i>=0;i--){var t=out[i];t.sh=Math.max(100,Math.round(t.sh*kf/100)*100);t.val=t.sh*t.pr;t.id=co.code+'-'+no;no-=Math.round(8+r()*60);}
 out.reverse();cache[co.id]=out;return out;
}
function money(co,v){var c=App.cur(co);return v>=1e6?c.sym+(v/1e6).toFixed(2)+'M':c.sym+App.num(Math.round(v));}
App.mount({page:'trades',title:'Trade history',roles:['client','multi','guest','admin'],scoped:true,needsData:true,states:true,skeleton:'table',
empty:function(ctx){return '<div class="mb-6"><h1 class="page-title">Trade history</h1></div><div class="card mx-auto max-w-lg p-8 text-center"><span class="bd dr">No trades yet</span><p class="mt-3 text-sm text-mut">Deltablock has not executed any trades in '+esc(ctx.co.name)+' yet. They appear here as soon as they are reported.</p></div>';},
render:function(ctx){
 var co=ctx.co,all=build(co),cu=App.cur(co),tz=cu.tz;
 var rows=all.filter(function(t){return (!f.from||t.iso>=f.from)&&(!f.to||t.iso<=f.to)&&(f.side==='All trades'||t.side===f.side)&&(!f.q||(t.id+' '+t.venue).toLowerCase().indexOf(f.q.toLowerCase())>=0);});
 ctx.rows=rows;
 var pages=Math.max(1,Math.ceil(rows.length/size));if(pg>pages)pg=pages;if(pg<1)pg=1;
 var a=(pg-1)*size,view=rows.slice(a,a+size),val=0,shs=0;rows.forEach(function(t){val+=t.val;shs+=t.sh;});
 var avg=shs?val/shs:null,period=(f.from&&f.to)?App.span(f.from,f.to):f.from?'From '+App.fmtDay(f.from):f.to?'Up to '+App.fmtDay(f.to):'All dates';
 var head='<div class="mb-6 flex flex-wrap items-end justify-between gap-3"><div><h1 class="page-title">Trade history</h1><p class="mt-2 text-sm text-mut">Deltablock&rsquo;s own executed trades in <b class="text-ink">'+esc(co.name)+'</b> &middot; '+esc(co.exch)+'</p></div><button id="export" class="btn btn-p" type="button"'+(rows.length?'':' disabled')+'>Export CSV &middot; '+App.num(rows.length)+' trade'+(rows.length===1?'':'s')+'</button></div>';
 var note='<div class="card mb-6 flex gap-3 bg-[var(--infb)] p-4 text-sm"><p class="text-mut"><b class="text-ink">These are Deltablock&rsquo;s trades only.</b> Every row is a trade Deltablock executed for '+esc(co.name)+', not all trades in the market. For Deltablock against the whole market, see <a class="underline" href="market.html">Market activity</a>.</p></div>';
 var totals='<section class="card mb-2 grid gap-4 p-5 md:grid-cols-3" aria-label="Totals for the filtered trades"><div><div class="text-xs text-cap">DELTABLOCK TRADE VALUE</div><div class="metric mt-2">'+(rows.length?money(co,val):'&mdash;')+'</div><div class="text-xs text-cap">Trades matching the filters</div></div><div><div class="text-xs text-cap">DELTABLOCK TRADES</div><div class="metric mt-2">'+App.num(rows.length)+'</div><div class="text-xs text-cap">Executed orders matching the filters</div></div><div><div class="text-xs text-cap">AVERAGE PRICE</div><div class="metric mt-2">'+(avg==null?'&mdash;':App.money(co,avg))+'</div><div class="text-xs text-cap">Per share, weighted by shares</div></div></section><p class="mb-6 text-xs text-cap">Totals follow the filters below and count every matching trade, not only the page you are looking at.</p>';
 var filters='<section class="mb-6 grid gap-4 md:grid-cols-4"><label class="text-xs text-cap">From<input data-f="from" type="date" class="inp mt-1" value="'+f.from+'"></label><label class="text-xs text-cap">To<input data-f="to" type="date" class="inp mt-1" value="'+f.to+'"></label><label class="text-xs text-cap">Side<select data-f="side" class="inp mt-1">'+['All trades','Buy','Sell'].map(function(x){return '<option'+(x===f.side?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label><label class="text-xs text-cap">Search<input data-f="q" class="inp mt-1" placeholder="Trade ID or venue" value="'+esc(f.q)+'"></label></section>';
 var table='<section class="card overflow-x-auto"><table class="tbl min-w-[720px]"><tr><th>Date &amp; time ('+esc(tz)+')</th><th>Trade ID</th><th>Side</th><th>Shares</th><th>Price ('+cu.code+')</th><th>Value ('+cu.code+')</th><th>Venue</th></tr>'+view.map(function(t){return '<tr><td>'+t.dt+'</td><td class="mono">'+t.id+'</td><td>'+t.side+'</td><td class="mono">'+App.num(t.sh)+'</td><td class="mono">'+App.money(co,t.pr)+'</td><td class="mono">'+cu.sym+App.num(Math.round(t.val))+'</td><td>'+esc(t.venue)+'</td></tr>';}).join('')+'</table>'+(rows.length?'':'<p class="p-5 text-sm text-cap">No trades match these filters.</p>')+
  (rows.length?'<div class="pager"><p class="text-sm text-mut" aria-live="polite">Showing '+App.num(a+1)+'&ndash;'+App.num(a+view.length)+' of '+App.num(rows.length)+' trades</p><div class="flex flex-wrap items-center gap-2"><label class="flex items-center gap-2 text-xs text-cap">Rows per page<select id="size" class="inp !w-20 !py-1.5">'+[25,50,100].map(function(n){return '<option'+(n===size?' selected':'')+'>'+n+'</option>';}).join('')+'</select></label><button type="button" class="btn btn-s" data-pg="1"'+(pg===1?' disabled':'')+' aria-label="First page">&laquo;</button><button type="button" class="btn btn-s" data-pg="'+(pg-1)+'"'+(pg===1?' disabled':'')+'>Previous</button><span class="px-1 text-sm">Page '+pg+' of '+App.num(pages)+'</span><button type="button" class="btn btn-s" data-pg="'+(pg+1)+'"'+(pg===pages?' disabled':'')+'>Next</button><button type="button" class="btn btn-s" data-pg="'+pages+'"'+(pg===pages?' disabled':'')+' aria-label="Last page">&raquo;</button></div></div>':'')+'</section>';
 return head+App.dataBar(co,esc(period))+note+totals+filters+table+'<p class="mt-3 text-xs text-cap">Sample data. Export CSV contains every Deltablock trade that matches the filters, on all pages.</p>';
},after:function(ctx,main){
 main.querySelectorAll('[data-f]').forEach(function(el){el.addEventListener('input',function(){f[el.dataset.f]=el.value;pg=1;var pos=el.selectionStart,key=el.dataset.f;ctx.refresh();if(key==='q'){var n=document.querySelector('[data-f=q]');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}});});
 main.querySelectorAll('[data-pg]').forEach(function(b){b.addEventListener('click',function(){pg=+b.dataset.pg;ctx.refresh();window.scrollTo(0,0);});});
 var sz=main.querySelector('#size');if(sz)sz.addEventListener('change',function(){size=+sz.value;pg=1;ctx.refresh();});
 main.querySelector('#export').addEventListener('click',function(){
  var cu=App.cur(ctx.co),head=['Date & time ('+cu.tz+')','Trade ID','Side','Shares','Price ('+cu.code+')','Value ('+cu.code+')','Venue'],body=ctx.rows.map(function(t){return [t.dt,t.id,t.side,t.sh,t.pr.toFixed(3),Math.round(t.val),t.venue];});
  var csv=[head].concat(body).map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='trade-history-'+ctx.co.code.toLowerCase()+'-'+(f.from||'start')+'-to-'+(f.to||'end')+'.csv';a.hidden=true;document.body.appendChild(a);a.click();a.remove();});
}});
})();
</script></body></html>

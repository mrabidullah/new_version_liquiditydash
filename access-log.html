<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access log | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head><body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
 var D=App.D,esc=App.esc,base=D.ACCESS_LOG,total=1096,size=10,page=1,q='';
 function stampOf(i){var d=new Date(Date.UTC(2026,9,22,8,41)-i*7*60000);return {text:new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'UTC'}).format(d).replace(',',''),iso:d.toISOString().slice(0,16).replace('T',' ')};}
 var entries=[];for(var i=0;i<total;i++){var p=base[i%base.length],s=stampOf(i);entries.push({stamp:s.text,first:p[0],last:p[1],email:p[2],company:p[3],hay:[s.text,s.iso,p[0],p[1],p[0]+' '+p[1],p[2],p[3]].join(' | ').toLowerCase()});}
 function filtered(){var t=q.trim().toLowerCase();if(!t)return entries;var words=t.split(/\s+/);return entries.filter(function(e){return words.every(function(w){return e.hay.indexOf(w)>=0;});});}
 App.mount({page:'access-log',title:'Access log',roles:['admin'],render:function(){
  var list=filtered(),n=list.length,pages=Math.max(1,Math.ceil(n/size));if(page>pages)page=pages;
  var start=(page-1)*size,end=Math.min(start+size,n),rows='',cards='';
  for(var i=start;i<end;i++){var e=list[i];
   rows+='<tr><td class="whitespace-nowrap">'+esc(e.stamp)+'</td><td>'+esc(e.first)+'</td><td>'+esc(e.last)+'</td><td class="text-mut">'+esc(e.email)+'</td><td>'+esc(e.company)+'</td></tr>';
   cards+='<li class="access-log-item"><time class="access-log-date">'+esc(e.stamp)+'</time><strong class="access-log-person">'+esc(e.first+' '+e.last)+'</strong><span class="access-log-company">'+esc(e.company)+'</span><span class="access-log-email">'+esc(e.email)+'</span></li>';}
  var empty=n?'':'<div class="p-8 text-center" role="status"><p class="font-medium">No entries match &ldquo;'+esc(q.trim())+'&rdquo;</p><p class="mt-1 text-sm text-cap">Try a name, an email address, a company, or a date such as &ldquo;22 Oct&rdquo;.</p><button type="button" class="btn mt-4" data-clear>Clear search</button></div>';
  return '<div class="mb-8"><h1 class="page-title">Access log</h1><p class="mt-2 text-sm text-mut">Who signed in, when, and which company they opened. Visible to admins only.</p></div><div class="card access-log-card overflow-x-auto"><form id="log-search" class="flex flex-wrap items-center gap-3 border-b px-5 py-4" role="search"><label class="sr-only" for="log-q">Search the access log</label><input id="log-q" class="inp !w-full sm:!w-80" type="search" placeholder="Search name, email, company or date" value="'+esc(q)+'" autocomplete="off"><button class="btn btn-p" type="submit">Search</button>'+(q?'<button type="button" class="btn" data-clear>Clear</button>':'')+'<span class="text-xs text-cap" id="log-result" aria-live="polite">'+(q.trim()?n.toLocaleString('en-GB')+' of '+total.toLocaleString('en-GB')+' entries match':'')+'</span></form>'+
   (n?'<table class="tbl access-log-table"><thead><tr><th scope="col">Date &amp; time</th><th scope="col">First name</th><th scope="col">Last name</th><th scope="col">Email</th><th scope="col">Company</th></tr></thead><tbody>'+rows+'</tbody></table><ul class="access-log-cards" aria-label="Access log entries">'+cards+'</ul>':'')+empty+
   '<div class="access-log-footer flex flex-wrap items-center justify-between gap-3 border-t px-5 py-3 text-sm"><b>'+n.toLocaleString('en-GB')+' total'+(q.trim()?' (filtered)':'')+'</b><nav class="access-log-pagination flex items-center gap-2" aria-label="Access log pagination"><button data-p="first" class="btn !px-3 !py-1.5" type="button" aria-label="First page"'+(page===1?' disabled':'')+'>&laquo;</button><button data-p="prev" class="btn !px-3 !py-1.5" type="button" aria-label="Previous page"'+(page===1?' disabled':'')+'>&lsaquo;</button><span id="page-status" class="whitespace-nowrap px-2 text-mut" aria-live="polite">Page '+(n?page:0)+' of '+(n?pages:0)+'</span><button data-p="next" class="btn !px-3 !py-1.5" type="button" aria-label="Next page"'+(page>=pages?' disabled':'')+'>&rsaquo;</button><button data-p="last" class="btn !px-3 !py-1.5" type="button" aria-label="Last page"'+(page>=pages?' disabled':'')+'>&raquo;</button></nav></div></div>';
 },after:function(ctx,main){
  var inp=main.querySelector('#log-q'),pages=Math.max(1,Math.ceil(filtered().length/size));
  function apply(v,keepFocus){q=v;page=1;var pos=inp.selectionStart;ctx.refresh();var ni=document.getElementById('log-q');if(keepFocus){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}}
  inp.addEventListener('input',function(){apply(inp.value,true);});
  main.querySelector('#log-search').addEventListener('submit',function(e){e.preventDefault();apply(inp.value,true);});
  main.querySelectorAll('[data-clear]').forEach(function(b){b.addEventListener('click',function(){apply('',false);document.getElementById('log-q').focus();});});
  main.querySelectorAll('[data-p]').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.p;page=k==='first'?1:k==='last'?pages:k==='prev'?Math.max(1,page-1):Math.min(pages,page+1);ctx.refresh();});});
 }});
})();
</script></body></html>

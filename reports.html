<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reports | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc;
function emptyHtml(ctx){
 var co=ctx.co,act=ctx.role==='admin'?'<a class="btn btn-p" href="publish.html?type=report&company='+encodeURIComponent(co.id)+'">Publish the first report</a>':(ctx.role==='guest'?'':'<a class="btn" href="tickets.html?new=1&subject='+encodeURIComponent('Reports for '+co.name)+'">Ask support</a>');
 return '<div class="mb-8"><h1 class="page-title">Reports</h1><p class="mt-2 text-sm text-mut">Published liquidity reports for '+esc(co.name)+'.</p></div><section class="card mx-auto max-w-xl p-8 text-center"><span class="bd dr">Nothing published yet</span><h2 class="mt-3 text-lg font-semibold">No reports for '+esc(co.name)+' yet</h2><p class="mt-2 text-sm text-mut">Reports appear here once Deltablock publishes them for '+esc(co.name)+'. There is nothing to download until then.</p>'+(act?'<div class="mt-6 flex flex-wrap justify-center gap-2">'+act+'</div>':'')+'</section>';
}
App.mount({page:'reports',title:'Reports',roles:['client','multi','guest','admin'],scoped:true,states:true,skeleton:'table',empty:emptyHtml,render:function(ctx){
 var co=ctx.co,list=App.reportsFor(co);
 if(!list.length)return emptyHtml(ctx);
 var pub=ctx.role==='admin'?'<a class="btn btn-p" href="publish.html?type=report&company='+encodeURIComponent(co.id)+'">Publish a report</a>':'';
 return '<div class="mb-8 flex flex-wrap items-end justify-between gap-3"><div><h1 class="page-title">Reports</h1><p class="mt-2 text-sm text-mut">Published liquidity reports for '+esc(co.name)+'.</p></div>'+pub+'</div><section class="card overflow-x-auto"><table class="tbl min-w-[600px]"><tr><th>Report</th><th>Period</th><th>Published</th><th>Status</th><th></th></tr>'+list.map(function(r){return '<tr><td><strong>'+esc(r.title)+'</strong><div class="text-xs text-cap">PDF &middot; '+esc(co.name)+'</div></td><td>'+esc(r.period)+'</td><td>'+esc(r.dateLabel)+'</td><td>'+App.badge('ok','Published')+'</td><td class="text-right"><a class="btn btn-s" href="'+esc(r.href||'#')+'" download'+(r.name?'="'+esc(r.name)+'"':'')+'>Download</a></td></tr>';}).join('')+'</table></section>'+(co.custom?'':'<p class="mt-3 text-xs text-cap">Sample PDFs: the prototype uses the same three files for every company.</p>');
}});
})();
</script></body></html>

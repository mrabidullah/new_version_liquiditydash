<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Accept invitation | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div class="fixed right-4 top-4 z-10"><button type="button" data-theme-toggle class="btn !p-2" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="t-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span><span class="t-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button></div><div class="auth-shell grid min-h-screen lg:grid-cols-[0.9fr_1.1fr]"><div class="hidden flex-col justify-between auth-panel p-10 text-white lg:flex xl:p-14"><div class="flex items-center gap-3"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 30 29H2z" fill="#F2B705"/><path d="M16 12 21.5 23h-11z" fill="#0A1220"/></svg><span class="font-semibold tracking-[.14em]">DELTABLOCK</span></div><div><div class="mb-8 w-72"><svg viewBox="0 0 320 240" class="w-full" aria-hidden="true"><rect x="40" y="30" width="170" height="110" rx="14" fill="#fff" opacity=".1"/><path d="M55 120 90 90l30 20 40-45 35 25" fill="none" stroke="#F2B705" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="150" width="14" height="40" rx="3" fill="#fff" opacity=".25"/><rect x="84" y="136" width="14" height="54" rx="3" fill="#fff" opacity=".25"/><rect x="108" y="120" width="14" height="70" rx="3" fill="#F2B705" opacity=".8"/><rect x="132" y="142" width="14" height="48" rx="3" fill="#fff" opacity=".25"/></svg></div><h2 class="max-w-md text-3xl font-semibold leading-tight">Liquidity insight for listed companies.</h2><p class="mt-3 max-w-md text-[#AEB8CE]">Track volume, spread and participation in one secure workspace.</p></div></div><div class="auth-form-stage grid place-items-center p-5 sm:p-8 lg:p-10"><div class="auth-mobile-brand flex items-center gap-2"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 30 29H2z" fill="#F2B705"/><path d="M16 12 21.5 23h-11z" fill="#0A1220"/></svg><b class="text-sm tracking-[.14em]">DELTABLOCK</b></div><div class="auth-form-card w-full max-w-md"><div id="gi"></div></div></div></div><script src="js/data.js"></script><script src="js/app.js"></script><script>
(function(){
 var D=App.D,esc=App.esc,t=App.qs('t'),box=document.getElementById('gi');
 var people=App.people(),g=people.filter(function(p){return p.token===t&&p.type==='guest';})[0];
 var sample=people.filter(function(p){return p.type==='guest'&&p.status==='pending';})[0];
 if(!g){box.innerHTML='<h1 class="text-2xl font-semibold tracking-tight">This invitation is not valid</h1><p class="mb-6 mt-2 text-sm text-mut">Guest invitations are personal. It may have expired, been cancelled or already been used.</p>'+(sample?'<div class="persona-note">Prototype: <a class="underline" href="guest-invite.html?t='+esc(sample.token)+'">open a sample guest invitation</a></div>':'')+'<a href="login.html" class="mt-5 inline-block text-sm text-mut">Back to sign in</a>';return;}
 if(g.status!=='pending'){box.innerHTML='<h1 class="text-2xl font-semibold tracking-tight">Invitation already accepted</h1><p class="mb-6 mt-2 text-sm text-mut">Sign in with '+esc(g.email)+'.</p><a href="login.html" class="btn btn-p">Go to sign in</a>';return;}
 var names=g.companies.map(function(i){return D.COMPANIES[i].name;}).join(', ');
 box.innerHTML='<h1 class="text-2xl font-semibold tracking-tight">Accept invitation</h1><p class="mb-6 mt-2 text-sm text-mut">'+esc(g.invitedBy||'A client')+' invited you to '+esc(names)+' as a read-only guest. Set your sign-in details to join.</p><form id="f"><label class="lbl" for="name">Your name</label><input id="name" class="inp mb-3" value="'+esc(g.name)+'" autocomplete="name" required><label class="lbl" for="email">Invited email</label><input id="email" class="inp mb-3" type="email" value="'+esc(g.email)+'" readonly><label class="lbl" for="password">Create password</label><input id="password" class="inp mb-3" type="password" placeholder="At least 12 characters" autocomplete="new-password" required minlength="12"><label class="lbl" for="confirm">Confirm password</label><input id="confirm" class="inp" type="password" autocomplete="new-password" required minlength="12"><p id="err" class="mt-3 hidden text-sm" style="color:var(--bad)" role="alert"></p><p class="mt-4 text-xs text-cap">Access to '+esc(names)+' includes six read-only pages: Overview, Market activity, Trade history, Peer comparison, Reports and Company profile.</p><button class="btn btn-p mt-4 w-full">Accept invitation</button></form><a href="login.html" class="mt-5 inline-block text-sm text-mut">Back to sign in</a>';
 document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
  var er=document.getElementById('err');er.classList.add('hidden');
  var res=App.acceptInvite(g.token,{name:document.getElementById('name').value,password:document.getElementById('password').value,confirm:document.getElementById('confirm').value});
  if(!res.ok){er.textContent=res.error;er.classList.remove('hidden');return;}
  location.href=res.home;});
})();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head><body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script><script>
(function(){
 var D=App.D,esc=App.esc;
 App.mount({page:'subscription',title:'Subscription',roles:['client','multi','admin'],scoped:true,render:function(ctx){
  var co=ctx.co,s=App.subs()[co.id],days=s.none?0:App.daysUntil(s.renewIso),K=D.KPI[co.id]&&D.KPI[co.id]['30d'],targets=[];
  if(!s.none&&co.timTarget!=null)targets.push(['Time at minimum spread','At least '+co.timTarget+'%',K?K.tim.toFixed(1)+'%':'—',K?K.tim>=co.timTarget:null]);
  if(!s.none&&co.sprTarget!=null)targets.push(['Average spread','At most '+co.sprTarget+' bps',K?K.spr.toFixed(1)+' bps':'—',K?K.spr<=co.sprTarget:null]);
  var overview='';
  if(ctx.allowed.length>1){
   overview='<section class="card mb-6 overflow-x-auto"><div class="border-b p-5"><h2 class="font-semibold">All your subscriptions</h2><p class="text-sm text-cap">One subscription per company. Pick a company to see its details below.</p></div><table class="tbl min-w-[560px]"><tr><th>Company</th><th>Plan</th><th>Renewal</th><th>Status</th><th></th></tr>'+ctx.allowed.map(function(i){var c=D.COMPANIES[i],x=App.subs()[i];return '<tr'+(i===co.id?' class="bg-hov"':'')+'><td><strong>'+esc(c.name)+'</strong></td><td>'+esc(x.plan)+'</td><td>'+esc(x.renewal)+'</td><td>'+App.badge(x.status[0],x.status[1])+'</td><td class="text-right">'+(i===co.id?'<span class="text-xs text-cap">Shown below</span>':'<button class="btn btn-s" data-pick="'+i+'">Show</button>')+'</td></tr>';}).join('')+'</table></section>';
  }
  if(s.none)return '<div class="mb-8"><h1 class="page-title">Subscription</h1><p class="mt-2 text-sm text-mut">Contract services, targets and term for '+esc(co.name)+'.</p></div>'+overview+'<section class="card p-8 text-center"><span class="bd dr">Not assigned</span><p class="mt-3 text-sm text-mut">No subscription has been assigned to '+esc(co.name)+' yet. All client pages stay available meanwhile.</p>'+(ctx.admin?'<a class="btn btn-p mt-4" href="admin-subscriptions.html">Assign a subscription</a>':'<a class="btn mt-4" href="tickets.html?new=1&subject='+encodeURIComponent('Subscription for '+co.name)+'">Contact support</a>')+'</section>';
  return '<div class="mb-8 flex flex-wrap items-end justify-between gap-3"><div><h1 class="page-title">Subscription</h1><p class="mt-2 text-sm text-mut">Contract services, targets and term for '+esc(co.name)+'.</p></div><a class="btn" href="tickets.html?new=1&subject='+encodeURIComponent('Subscription change request · '+co.name)+'">Request a change</a></div>'+overview+
   '<section class="mb-6 grid gap-4 md:grid-cols-3"><div class="card p-4"><div class="text-xs text-cap">PLAN</div><div class="mt-2 text-lg font-semibold">'+esc(s.plan)+'</div><div class="mt-1 text-xs text-cap">'+esc(s.term)+'</div></div><div class="card p-4"><div class="text-xs text-cap">SUBSCRIPTION STATUS</div><div class="mt-2">'+App.badge(s.status[0],s.status[1])+'</div><div class="mt-2 text-xs text-cap">'+(days<0?'Expired on '+esc(s.end):'Renews in '+days+' days')+'</div></div><div class="card p-4"><div class="text-xs text-cap">NEXT RENEWAL</div><div class="metric mt-2 !text-lg">'+esc(s.renewal)+'</div><div class="mt-1 text-xs text-cap">'+esc(s.autoRenew)+'</div></div></section>'+
   '<section class="card mb-6 overflow-x-auto"><div class="border-b p-5"><h2 class="font-semibold">Included services</h2><p class="text-sm text-cap">What Deltablock provides to '+esc(co.name)+' under the contract.</p></div><table class="tbl min-w-[560px]"><tr><th>Contracted service</th><th>Scope</th><th>Status</th></tr>'+s.services.map(function(x){return '<tr><td><strong>'+esc(x[0])+'</strong></td><td>'+esc(x[1])+'</td><td>'+App.badge('ok','Active')+'</td></tr>';}).join('')+'</table>'+(s.services.length?'':'<p class="p-5 text-sm text-cap">No services have been recorded for this subscription yet.</p>')+'</section>'+
   '<section class="card mb-6 overflow-x-auto"><div class="border-b p-5"><h2 class="font-semibold">Contract targets</h2><p class="text-sm text-cap">Service levels Deltablock commits to, next to the last 30 days.</p></div>'+(targets.length?'<table class="tbl min-w-[560px]"><tr><th>Target</th><th>Contracted level</th><th>Last 30 days</th><th>Result</th></tr>'+targets.map(function(t){return '<tr><td><strong>'+esc(t[0])+'</strong></td><td class="mono">'+esc(t[1])+'</td><td class="mono">'+esc(t[2])+'</td><td>'+(t[3]===null?App.badge('dr','No data'):App.badge(t[3]?'ok':'warn',t[3]?'Target met':'Not met'))+'</td></tr>';}).join('')+'</table>':'<p class="p-5 text-sm text-cap">No targets have been set for this company yet.</p>')+'</section>'+
   '<section class="card mb-6 p-5"><h2 class="font-semibold">Service term</h2><dl class="mt-4 grid gap-x-6 gap-y-4 text-sm sm:grid-cols-2 lg:grid-cols-4"><div><dt class="text-xs text-cap">Term</dt><dd class="mt-1 font-medium">'+esc(s.term)+'</dd></div><div><dt class="text-xs text-cap">Contract start date</dt><dd class="mt-1 font-medium">'+esc(s.start)+'</dd></div><div><dt class="text-xs text-cap">Contract end date</dt><dd class="mt-1 font-medium">'+esc(s.end)+'</dd></div><div><dt class="text-xs text-cap">Renewal date</dt><dd class="mt-1 font-medium">'+esc(s.renewal)+'</dd></div></dl><p class="mt-4 border-t pt-3 text-sm text-mut"><b class="text-ink">Renewal:</b> '+esc(s.autoRenew)+'.</p></section>';
 },after:function(ctx,main){
  main.querySelectorAll('[data-pick]').forEach(function(b){b.addEventListener('click',function(){if(!App.switchCompany(b.dataset.pick)){App.toast('You do not have access to that company.','err');return;}ctx.refresh();});});
 }});
})();
</script></body></html>

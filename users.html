<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Users | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc,filter='all',q='',editId=null,removeId=null,addedAdmin=null;
function initials(n){return String(n).split(' ').map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();}
function match(p){return filter==='all'||(filter==='admin'&&p.type==='admin')||(filter==='client'&&p.type==='client')||(filter==='colleague'&&p.type==='colleague')||(filter==='guest'&&p.type==='guest')||(filter==='pending'&&p.status==='pending');}
function setupUrl(p){return App.absUrl('signup.html?t='+encodeURIComponent(p.token));}
App.mount({page:'users',title:'Users',roles:['admin'],render:function(ctx){
 var all=App.people(),list=all.filter(function(p){return match(p)&&(!q||(p.name+' '+p.email).toLowerCase().indexOf(q.toLowerCase())>=0);});
 function n(f){var s=filter;filter=f;var c=all.filter(match).length;filter=s;return c;}
 function owner(p){var o=all.filter(function(x){return x.email===p.tenant&&x.owner;})[0];return o&&o.email!==p.email?o.name:'';}
 var rows=list.map(function(p){
  var adm=p.type==='admin',pend=p.status==='pending',act;
  if(adm)act=pend?'<button class="btn btn-s" data-setup="'+p.id+'">Copy setup link</button> <button class="btn btn-s btn-d" data-remove="'+p.id+'">Cancel</button>':'<span class="text-xs text-cap">Admin</span>';
  else act='<button class="btn btn-s" data-edit="'+p.id+'">Edit access</button> <button class="btn btn-s btn-d" data-remove="'+p.id+'">'+(pend?'Cancel':'Remove')+'</button>';
  var mg=p.manages&&p.manages.length&&!adm?'<div class="mt-1 text-xs text-cap">Manages Team: '+esc(p.manages.map(function(c){return D.COMPANIES[c]?D.COMPANIES[c].name:c;}).join(', '))+'</div>':'';
  return '<tr><td><div class="flex items-center gap-3"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-hov text-xs font-semibold text-mut">'+esc(initials(p.name))+'</span><div><div class="font-medium">'+esc(p.name)+'</div><div class="text-xs text-cap">'+esc(p.email)+'</div></div></div></td><td>'+App.badge(adm?'inf':'dr',App.typeLabel(p))+'</td><td>'+(adm?'<span class="chip-list"><span class="chip">All companies</span></span>':App.chips(p.companies))+mg+'</td><td class="text-mut">'+(owner(p)?'Invited by '+esc(owner(p)):(p.via?esc(p.via):'&mdash;'))+'</td><td>'+(pend?App.badge('warn',adm?'Setup pending':'Pending'):App.badge('ok','Active'))+'</td><td class="whitespace-nowrap text-right">'+act+'</td></tr>';}).join('');
 var res=addedAdmin?'<div class="card mb-6 border-[#F2B705] p-5"><div class="flex flex-wrap items-center justify-between gap-3"><div><div class="font-semibold">Administrator added: '+esc(addedAdmin.name)+'</div><p class="text-sm text-cap">They become an active administrator once they open the setup link and choose a password. Prototype: no email is sent, so share the link yourself.</p></div><button class="btn btn-p" id="copy-setup">Copy setup link</button></div><input class="inp mono mt-3 !text-xs" readonly value="'+esc(setupUrl(addedAdmin))+'" aria-label="Setup link"></div>':'';
 return '<div class="mb-8 flex flex-wrap items-end justify-between gap-3"><div><h1 class="page-title">Users</h1><p class="mt-2 text-sm text-mut">Everyone with an account or a pending invitation. Company managers handle their own company&rsquo;s Team; you can change company access and manager rights here.</p></div><div class="flex flex-wrap gap-2"><button type="button" class="btn" id="add-admin-btn">+ Add admin</button><a class="btn btn-p" href="signup-links.html">Create a client sign-up link</a></div></div>'+res+
 '<section class="card overflow-x-auto"><div class="flex flex-wrap items-center justify-between gap-3 border-b px-5 py-4"><div class="seg" role="group" aria-label="Filter">'+[['all','All'],['admin','Admins'],['client','Clients'],['colleague','Colleagues'],['guest','Guests'],['pending','Pending']].map(function(f){return '<button type="button" data-f="'+f[0]+'" aria-pressed="'+(f[0]===filter)+'">'+f[1]+' ('+n(f[0])+')</button>';}).join('')+'</div><input id="q" class="inp !w-64" type="search" placeholder="Search name or email" aria-label="Search users" value="'+esc(q)+'"></div><table class="tbl min-w-[860px]"><tr><th>Person</th><th>Type</th><th>Companies</th><th>Account</th><th>Status</th><th class="text-right">Actions</th></tr>'+rows+'</table>'+(list.length?'':'<p class="p-5 text-sm text-cap">No users match.</p>')+'</section>';
},extra:function(){
 var boxes=D.ORDER.map(function(i){return '<div class="check-row"><label class="flex flex-1 items-center gap-2"><input type="checkbox" name="ed-co" value="'+i+'"> '+esc(D.COMPANIES[i].name)+'</label><label class="ml-auto flex items-center gap-1.5 text-xs text-cap"><input type="checkbox" name="ed-mg" value="'+i+'"> Can manage Team</label></div>';}).join('');
 return '<div id="edit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="et"><form id="edit-form" class="card w-full max-w-md"><div class="border-b px-6 py-4"><h2 id="et" class="font-semibold">Edit company access</h2><p id="edit-who" class="text-sm text-cap"></p></div><div class="space-y-2 p-6">'+boxes+'<p class="pt-2 text-xs text-cap">Access lets someone see a company. &ldquo;Can manage Team&rdquo; also lets them invite people and change access for that company. Guests cannot manage.</p></div><div class="flex justify-end gap-2 border-t px-6 py-4"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-p">Save access</button></div></form></div>'+
 '<div id="remove-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="rt"><div class="card w-full max-w-md"><div class="border-b px-6 py-4"><h2 id="rt" class="font-semibold">Remove user</h2></div><p id="remove-text" class="p-6 text-sm text-mut"></p><div class="flex justify-end gap-2 border-t px-6 py-4"><button type="button" class="btn" data-close>Cancel</button><button id="remove-go" class="btn btn-p">Remove</button></div></div></div>'+
 '<div id="admin-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="at"><form id="admin-form" class="card w-full max-w-md" novalidate><div class="border-b px-6 py-4"><h2 id="at" class="font-semibold">Add admin</h2><p class="text-sm text-cap">Creates a new administrator account that still needs to be set up with a password. Existing clients are never converted.</p></div><div class="space-y-4 p-6"><p class="field-err" id="ad-form-err" role="alert" hidden></p><div class="grid gap-4 sm:grid-cols-2"><div><label class="lbl" for="ad-first">First name <span class="text-cap">*</span></label><input id="ad-first" class="inp" autocomplete="off"><p class="field-err" id="ad-first-err" role="alert" hidden></p></div><div><label class="lbl" for="ad-last">Last name <span class="text-cap">*</span></label><input id="ad-last" class="inp" autocomplete="off"><p class="field-err" id="ad-last-err" role="alert" hidden></p></div></div><div><label class="lbl" for="ad-email">Email address <span class="text-cap">*</span></label><input id="ad-email" type="email" class="inp" autocomplete="off"><p class="field-err" id="ad-email-err" role="alert" hidden></p></div></div><div class="flex justify-end gap-2 border-t px-6 py-4"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-p">Add admin</button></div></form></div>';
},after:function(ctx,main,ov){
 function find(id){return App.people().filter(function(p){return p.id===id;})[0];}
 main.querySelectorAll('[data-f]').forEach(function(b){b.addEventListener('click',function(){filter=b.dataset.f;ctx.refresh();});});
 var qi=main.querySelector('#q');qi.addEventListener('input',function(){q=qi.value;var pos=qi.selectionStart;ctx.refresh();var nq=document.getElementById('q');nq.focus();try{nq.setSelectionRange(pos,pos);}catch(e){}});
 function syncMg(){ov.querySelectorAll('[name=ed-co]').forEach(function(c){var mg=ov.querySelector('[name=ed-mg][value="'+c.value+'"]'),guest=find(editId)&&find(editId).type==='guest';mg.disabled=!c.checked||guest;if(mg.disabled)mg.checked=false;});}
 ov.querySelectorAll('[name=ed-co]').forEach(function(c){c.addEventListener('change',syncMg);});
 main.querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click',function(){var p=find(b.dataset.edit);if(!p)return;editId=p.id;ov.querySelector('#edit-who').textContent=p.name+' · '+App.typeLabel(p);
  ov.querySelectorAll('[name=ed-co]').forEach(function(c){c.checked=p.companies.indexOf(c.value)>=0;});ov.querySelectorAll('[name=ed-mg]').forEach(function(c){c.checked=(p.manages||[]).indexOf(c.value)>=0;});syncMg();App.openModal('edit-modal');});});
 ov.querySelector('#edit-form').addEventListener('submit',function(e){e.preventDefault();
  var cos=[].slice.call(ov.querySelectorAll('[name=ed-co]:checked')).map(function(c){return c.value;}),mg=[].slice.call(ov.querySelectorAll('[name=ed-mg]:checked')).map(function(c){return c.value;});
  var res=App.setAccessAdmin(editId,cos,mg);if(!res.ok){App.toast(res.error,'err');return;}
  App.closeModals();App.toast('Access updated');ctx.refresh();});
 main.querySelectorAll('[data-remove]').forEach(function(b){b.addEventListener('click',function(){var p=find(b.dataset.remove);if(!p)return;removeId=p.id;ov.querySelector('#remove-text').textContent=(p.status==='pending'?'Cancel the invitation for ':'Remove ')+p.name+' ('+p.email+')? This cannot be undone.';App.openModal('remove-modal');});});
 ov.querySelector('#remove-go').addEventListener('click',function(){var p=find(removeId),res=App.removePerson(removeId);App.closeModals();if(!res.ok){App.toast(res.error,'err');return;}App.toast((p?p.name:'User')+' removed');ctx.refresh();});
 main.querySelectorAll('[data-setup]').forEach(function(b){b.addEventListener('click',function(){var p=find(b.dataset.setup);if(p&&p.token)App.copy(setupUrl(p));});});
 var cs=main.querySelector('#copy-setup');if(cs)cs.addEventListener('click',function(){App.copy(setupUrl(addedAdmin));});
 main.querySelector('#add-admin-btn').addEventListener('click',function(){App.openModal('admin-modal');});
 var af=ov.querySelector('#admin-form');
 af.addEventListener('submit',function(e){e.preventDefault();
  af.querySelectorAll('.field-err').forEach(function(p){p.hidden=true;});af.querySelectorAll('[aria-invalid]').forEach(function(i){i.removeAttribute('aria-invalid');});
  var res=App.addAdmin({first:af.querySelector('#ad-first').value,last:af.querySelector('#ad-last').value,email:af.querySelector('#ad-email').value});
  if(!res.ok){var tgt=res.field?af.querySelector('#ad-'+res.field+'-err'):af.querySelector('#ad-form-err');tgt.textContent=res.error;tgt.hidden=false;if(res.field){var i=af.querySelector('#ad-'+res.field);i.setAttribute('aria-invalid','true');i.focus();}return;}
  addedAdmin=res.person;App.closeModals();af.reset();filter='all';q='';ctx.refresh();window.scrollTo(0,0);App.toast('Administrator added. Share the setup link with them.');});
}});
})();
</script></body></html>

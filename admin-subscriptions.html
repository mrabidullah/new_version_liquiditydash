<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Subscriptions | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc,PLANS=['Liquidity Essentials','Liquidity Plus','Investor Relations'],editId=null;
var PAGE_NAMES=['overview','market activity','trade history','peer comparison','reports','statements','subscription','company profile','team','support'];
function fmtIso(x){return x&&x!=='—'?x:'—';}
function svcText(s){return (s.services||[]).map(function(v){return v[0]+(v[1]?' | '+v[1]:'');}).join('\n');}
function parseSvc(t){return String(t||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){var k=l.indexOf('|');return k<0?[l,'']:[l.slice(0,k).trim(),l.slice(k+1).trim()];});}
function formHtml(id){
 var subs=App.subs(),s=subs[id],co=D.COMPANIES[id],none=!!s.none,rIso=s.renewIso||App.addIso(D.TODAY,365),sIso=s.startIso||(s.renewIso?App.addIso(s.renewIso,-365):D.TODAY);
 return '<div class="space-y-4 p-6"><div class="rounded-lg border bg-hov p-4 text-sm"><div class="flex flex-wrap items-center justify-between gap-2"><b>'+esc(co.name)+'</b>'+App.badge(s.status[0],s.status[1])+'</div><dl class="mt-3 grid grid-cols-2 gap-3 text-xs"><div><dt class="text-cap">Current plan</dt><dd class="mt-0.5 font-medium text-ink">'+esc(s.plan)+'</dd></div><div><dt class="text-cap">Term</dt><dd class="mt-0.5 font-medium text-ink">'+esc(none?'—':s.term)+'</dd></div><div><dt class="text-cap">Start</dt><dd class="mt-0.5 font-medium text-ink">'+esc(s.start)+'</dd></div><div><dt class="text-cap">End</dt><dd class="mt-0.5 font-medium text-ink">'+esc(s.end)+'</dd></div><div class="col-span-2"><dt class="text-cap">Renewal</dt><dd class="mt-0.5 font-medium text-ink">'+esc(s.renewal)+'</dd></div></dl></div>'+
 '<p class="field-err" id="sf-err" role="alert" hidden></p>'+
 '<div><label class="lbl" for="s-plan">Plan</label><select id="s-plan" class="inp">'+PLANS.map(function(p){return '<option'+(p===s.plan?' selected':'')+'>'+p+'</option>';}).join('')+'</select><p class="mt-1 text-xs text-cap">The plan is a commercial label. It never changes which pages the client can open.</p></div>'+
 '<div><label class="lbl" for="s-term">Service term</label><input id="s-term" class="inp" value="'+esc(none||s.term==='—'?'Annual service':s.term)+'"></div>'+
 '<div class="grid gap-4 sm:grid-cols-2"><div><label class="lbl" for="s-start">Contract start date</label><input id="s-start" class="inp" type="date" required value="'+sIso+'"></div><div><label class="lbl" for="s-renew">Renewal date</label><input id="s-renew" class="inp" type="date" required value="'+rIso+'"></div></div><p class="-mt-2 text-xs text-cap">The contract end date is the day before the renewal date.</p>'+
 '<div><label class="lbl" for="s-auto">Renewal terms</label><input id="s-auto" class="inp" value="'+esc(s.autoRenew||'Renews automatically unless cancelled 60 days before the end date')+'"></div>'+
 '<div><label class="lbl" for="s-svc">Contracted services</label><textarea id="s-svc" class="inp h-32" placeholder="Service | Scope">'+esc(svcText(s))+'</textarea><p class="mt-1 text-xs text-cap">One per line: Service | Scope. Website pages (Overview, Trade history, Reports and so on) are not services.</p></div></div>';
}
App.mount({page:'admin-subscriptions',title:'Subscriptions',roles:['admin'],render:function(ctx){
 var subs=App.subs();
 return '<div class="mb-8"><h1 class="page-title">Subscriptions</h1><p class="mt-2 text-sm text-mut">One subscription per company. Choose Edit to change a company&rsquo;s contract details; clients see them on their Subscription page.</p></div>'+
 '<section class="card overflow-x-auto"><table class="tbl min-w-[860px]"><tr><th>Company</th><th>Plan</th><th>Term</th><th>Start</th><th>End</th><th>Renewal</th><th>Services</th><th>Status</th><th></th></tr>'+D.ORDER.map(function(i){var x=subs[i];return '<tr><td><strong>'+esc(D.COMPANIES[i].name)+'</strong></td><td>'+esc(x.plan)+'</td><td>'+(x.none?'—':esc(x.term))+'</td><td>'+esc(x.start)+'</td><td>'+esc(x.end)+'</td><td>'+esc(x.renewal)+'</td><td>'+(x.none?'—':(x.services||[]).length)+'</td><td>'+App.badge(x.status[0],x.status[1])+'</td><td class="text-right"><button class="btn btn-s" data-edit="'+i+'" aria-label="Edit subscription for '+esc(D.COMPANIES[i].name)+'">Edit</button></td></tr>';}).join('')+'</table></section>';
},extra:function(){
 return '<div id="sub-drawer" class="modal drawer" role="dialog" aria-modal="true" aria-labelledby="sd-t"><form id="sf" class="card drawer-panel" novalidate><div class="flex items-start justify-between gap-3 border-b px-6 py-4"><div><h2 id="sd-t" class="font-semibold">Edit subscription</h2><p id="sd-co" class="text-sm text-cap"></p></div><button type="button" class="btn btn-s" data-close aria-label="Close">&times;</button></div><div id="sd-body" class="flex-1"></div><div class="flex justify-end gap-2 border-t px-6 py-4"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-p">Save subscription</button></div></form></div>';
},after:function(ctx,main,ov){
 var form=ov.querySelector('#sf');
 main.querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click',function(){
  editId=b.dataset.edit;ov.querySelector('#sd-co').textContent=D.COMPANIES[editId].name;ov.querySelector('#sd-body').innerHTML=formHtml(editId);App.openModal('sub-drawer');});});
 form.addEventListener('submit',function(e){e.preventDefault();
  var err=ov.querySelector('#sf-err');err.hidden=true;
  function bad(m){err.textContent=m;err.hidden=false;App.toast(m,'err');}
  if(!App.can.admin()){bad('Only administrators can change subscriptions.');return;}
  var id=editId,start=ov.querySelector('#s-start').value,renew=ov.querySelector('#s-renew').value,term=ov.querySelector('#s-term').value.trim(),auto=ov.querySelector('#s-auto').value.trim(),svc=parseSvc(ov.querySelector('#s-svc').value);
  if(!D.COMPANIES[id]||!start||!renew){bad('Choose both dates.');return;}
  if(renew<=start){bad('Renewal date must be after the start date.');return;}
  if(!term){bad('Enter the service term.');return;}
  var web=svc.filter(function(v){return PAGE_NAMES.indexOf(v[0].toLowerCase())>=0;});
  if(web.length){bad('“'+web[0][0]+'” is a website page, not a contracted service. Remove it from the list.');return;}
  var subs=App.subs(),x=subs[id],days=App.daysUntil(renew);
  if(x.none)x.none=false;
  x.plan=ov.querySelector('#s-plan').value;x.term=term;x.autoRenew=auto||'Renews annually';x.services=svc;
  x.start=App.fmtDate(start);x.startIso=start;x.end=App.fmtDate(App.addIso(renew,-1));x.renewal=App.fmtDate(renew);x.renewIso=renew;
  x.status=days<0?['bad','Expired']:days<=60?['warn','Renews soon']:['ok','Active'];
  App.saveSubs(subs);App.closeModals();ctx.refresh();App.toast('Subscription saved for '+D.COMPANIES[id].name);});
}});
})();
</script></body></html>
